name: Desplegar a GitHub Pages

on:
  push:
    branches:
      - main  # Esto se ejecuta cuando haces push a la rama principal
  workflow_dispatch: # Permite ejecutar el workflow manualmente desde la interfaz de GitHub

# Permisos necesarios para que la Action pueda hacer push a la rama gh-pages
permissions:
  contents: write

# Regla de concurrencia: si un despliegue ya está en curso, cancela el anterior.
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"

      - name: Instalar dependencias
        run: npm ci

      - name: Construir el proyecto (npm run build)
        run: npm run build

      # Publica el contenido de 'dist' directamente a la rama gh-pages,
      # el mismo método que ya usa 'npm run deploy' y que GitHub Pages sirve.
      - name: Desplegar a la rama gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
